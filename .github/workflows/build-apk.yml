name: Zbuduj APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: assembleDebug
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: sct-krakow-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Wydanie z APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk sct-krakow.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk sct-krakow.apk \
            --title "SCT Kraków — APK" \
            --notes "Build #${{ github.run_number }}. Pobierz sct-krakow.apk na telefon i zainstaluj."
